name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hooks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Hook tests (bash)
        shell: bash
        run: bash tests/run-tests.sh

      - name: Wrappers through cmd.exe (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call hooks\run-hook.cmd session-start < tests\fixtures\windows-path.json > "%RUNNER_TEMP%\out.json"
          if errorlevel 1 exit /b 1
          node -e "const o=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));const c=o.hookSpecificOutput.additionalContext;if(!c.includes('standing rules'))process.exit(1);console.log('PASS cmd wrapper, '+c.length+' chars')" "%RUNNER_TEMP%\out.json"
          set "T=%CD%\tests\fixtures\transcripts\valid.jsonl"
          set "CLAUDE_PLUGIN_DATA=%RUNNER_TEMP%\lwdata"
          set "HONZAPOWERS_HANDOVER_TOKENS=100000"
          node -e "process.stdout.write(JSON.stringify({session_id:'ci',transcript_path:process.env.T}))" > "%RUNNER_TEMP%\ups-in.json"
          call hooks\run-hook.cmd user-prompt-submit < "%RUNNER_TEMP%\ups-in.json" > "%RUNNER_TEMP%\ups.json"
          if errorlevel 1 exit /b 1
          node -e "const o=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));const c=o.hookSpecificOutput.additionalContext;if(!c.includes('~120k'))process.exit(1);console.log('PASS cmd wrapper user-prompt-submit')" "%RUNNER_TEMP%\ups.json"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.321
      - name: Validate plugin and marketplace
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/marketplace.json
      - name: Eval cases load (no agent runs, cost ceiling 0)
        run: |
          out="$(claude plugin eval . --no-publish --trust-plugin --max-cost-usd 0 --allow-tools Write Edit Bash 2>&1 || true)"
          printf '%s\n' "$out" | tail -n 6
          n="$(find evals -mindepth 2 -maxdepth 2 -name prompt.md | wc -l)"
          printf '%s\n' "$out" | grep -q "2 arms × $n cases" || { echo "FAIL: expected $n cases"; exit 1; }
          if printf '%s\n' "$out" | grep -qE 'failed to load|cannot pass'; then echo "FAIL: eval case problem"; exit 1; fi
          echo "PASS: $n eval cases load"
